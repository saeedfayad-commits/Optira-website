<div class="career-card" data-cluster="{{CLUSTER}}">
        <div class="career-card-top">
          <span class="career-cluster">{{CLUSTER_EMOJI}} {{CLUSTER}}</span>
          <span class="ai-badge {{AI_BADGE_CLASS}}">AI: {{AI_IMPACT}}</span>
        </div>
        <div class="career-card-title">{{TITLE}}</div>
        <div class="career-card-desc">{{LEDE}}</div>
        <div class="career-card-stats">
          <div class="stat-pill"><span class="stat-pill-label">Salary</span><span class="stat-pill-value">{{SALARY}}</span></div>
          <div class="stat-pill"><span class="stat-pill-label">Study</span><span class="stat-pill-value">{{STUDY_TIME}}</span></div>
        </div>
        <div class="career-skills">
{{SKILL_TAGS}}
        </div>
        <div class="career-card-footer">
          <a href="careers/{{SLUG}}.html" class="view-link">View Career →</a>
        </div>
      </div>
